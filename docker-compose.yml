services:
  # PostgreSQL
  db:
    image: postgres:16
    container_name: shareit-db
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: us
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U us -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Приложение ShareIt
  app:
    build: .
    container_name: shareit-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shareit
      SPRING_DATASOURCE_USERNAME: us
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_SQL_INIT_MODE: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data: